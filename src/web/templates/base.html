<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Confidior{% endblock %}</title>
    <style>
        :root {
            --bg: #0f1117;
            --bg-panel: #161822;
            --bg-panel-2: #1c1f2b;
            --line: #1e2030;
            --line-strong: #2d3040;
            --text: #e5e7eb;
            --text-dim: #9ca3af;
            --text-mute: #6b7280;
            --text-faint: #4b5563;
            --accent: #60a5fa;
            --accent-strong: #2563eb;
            --green: #4ade80;
            --red: #f87171;
            --amber: #fbbf24;
            --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        nav { background: var(--bg-panel); border-bottom: 1px solid var(--line); padding: 0.75rem 0; }
        .nav-inner { max-width: 960px; margin: 0 auto; padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 1.25rem; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
        .nav-links { display: flex; gap: 1.5rem; }
        .nav-links a { color: var(--text-dim); font-size: 0.875rem; }
        .nav-links a:hover { color: var(--text); text-decoration: none; }
        main { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }
        h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 1.5rem; }
        h2 { font-size: 1.125rem; font-weight: 600; margin-bottom: 1rem; }
        h3 { font-size: 1rem; font-weight: 600; margin-bottom: 0.5rem; }

        /* ---------- browser frames (engine-page aesthetic) ---------- */
        .frame { border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--bg-panel); overflow: hidden; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35); margin-bottom: 1.5rem; }
        .win-bar { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--bg-panel-2); border-bottom: 1px solid var(--line); }
        .url { flex: 1; font-family: var(--mono); font-size: 12px; color: var(--text-mute); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tag { flex: none; }
        .win-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
        @media (max-width: 800px) { .win-body { grid-template-columns: 1fr; } }
        .win-body.split { grid-template-columns: 1fr 1.4fr; }
        .form-panel, .result-panel { padding: 26px; }
        .form-panel { border-right: 1px solid var(--line); }
        @media (max-width: 800px) { .form-panel { border-right: none; border-bottom: 1px solid var(--line); } }
        .result-panel { background: var(--bg); }
        .panel-title { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-mute); margin-bottom: 18px; }
        .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }

        /* ---------- forms ---------- */
        .field { margin-bottom: 1rem; }
        .field label { display: block; font-size: 0.875rem; color: var(--text-dim); margin-bottom: 0.375rem; }
        .field input, .field select, .field textarea {
            width: 100%; padding: 0.5rem 0.75rem; background: var(--bg); border: 1px solid var(--line-strong);
            border-radius: 6px; color: var(--text); font-size: 0.875rem; font-family: var(--mono);
        }
        .field textarea { min-height: 120px; resize: vertical; }
        .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent-strong); }
        .muted { color: var(--text-mute); }
        .small { font-size: 0.75rem; }

        /* ---------- buttons ---------- */
        .btn { display: inline-block; padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.875rem; font-weight: 500; border: 1px solid var(--line-strong); background: var(--bg-panel-2); color: var(--text); cursor: pointer; }
        .btn:hover { background: var(--line-strong); text-decoration: none; }
        .btn-primary { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }

        /* ---------- segmented badge (engine-page aesthetic) ---------- */
        .badge-row { display: inline-flex; overflow: hidden; border-radius: 6px; font-family: var(--mono); font-size: 12px; box-shadow: 0 0 0 1px var(--line); margin-bottom: 18px; }
        .seg { padding: 6px 12px; }
        .seg-label { background: #555; color: #fff; }
        .seg-fail { background: #df3c30; color: #fff; }
        .seg-pass { background: #16a34a; color: #fff; }
        .seg-score { background: var(--bg-panel-2); color: var(--text-dim); border-left: 1px solid var(--line); }

        /* ---------- score line ---------- */
        .score-line { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
        .score { font-size: 2.4rem; font-weight: 700; color: var(--accent); line-height: 1; }
        .score-of { font-size: 1.1rem; color: var(--text-faint); }

        /* ---------- chips ---------- */
        .chip { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; font-family: var(--mono); }
        .chip-red { background: #450a0a; color: var(--red); }
        .chip-green { background: #052e16; color: var(--green); }
        .chip-amber { background: #422006; color: var(--amber); }
        .chip-blue { background: #172554; color: var(--accent); }

        /* ---------- dimension list ---------- */
        .dims { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
        .dims li { display: flex; justify-content: space-between; gap: 16px; padding: 10px 2px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 12.5px; }
        .dims li span:first-child { color: var(--text-mute); }
        .dims li span:last-child { color: var(--text); text-align: right; }

        /* ---------- legacy helpers ---------- */
        .card { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; }
        .error { background: #1c1017; border: 1px solid #7f1d1d; color: #fca5a5; padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.875rem; }
        .badge { display: inline-block; padding: 0.125rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .badge-green { background: #052e16; color: var(--green); }
        .badge-yellow { background: #422006; color: var(--amber); }
        .badge-red { background: #450a0a; color: var(--red); }
        .badge-orange { background: #431407; color: #fb923c; }
        .badge-blue { background: #172554; color: var(--accent); }
        table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        th { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--line); color: var(--text-dim); font-weight: 500; }
        td { padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--line); }
        .empty { color: var(--text-mute); font-size: 0.875rem; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
        .stat { text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: 700; }
        .stat-label { font-size: 0.75rem; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.05em; }
        code { background: var(--bg-panel-2); padding: 0.125rem 0.375rem; border-radius: 3px; font-size: 0.8rem; }
        pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1rem; overflow-x: auto; font-size: 0.8rem; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="/" class="logo">Confidior</a>
            <div class="nav-links">
                <a href="/submit">Submit</a>
                <a href="/verify">Verify</a>
                <a href="/archaeology">Attacks</a>
                <a href="/waitlist">Cloud</a>
                <a href="/">Dashboard</a>
            </div>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
